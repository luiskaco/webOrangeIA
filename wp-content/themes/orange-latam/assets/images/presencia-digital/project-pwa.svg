    <path d="M164 352 L204 340 L244 346 L284 322 L324 330 L364 302 L404 310 L444 284 L484 290 L522 268 L522 368 L164 368 Z"
          fill="url(#pwaArea)"/>
    <circle cx="444" cy="284" r="5" fill="#00F0FF"/>

    <!-- Activity rows -->
    <rect x="148" y="396" width="390" height="26" rx="8" fill="#111E42"/>
    <circle cx="166" cy="409" r="7" fill="#0B2B3A" stroke="#00F0FF" stroke-opacity="0.6"/>
    <rect x="184" y="404" width="150" height="9" rx="4.5" fill="#475569"/>
    <rect x="470" y="404" width="52" height="9" rx="4.5" fill="#334765"/>
    <rect x="148" y="430" width="390" height="26" rx="8" fill="#111E42"/>
    <circle cx="166" cy="443" r="7" fill="#161A45" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <rect x="184" y="438" width="120" height="9" rx="4.5" fill="#475569"/>
    <rect x="470" y="438" width="52" height="9" rx="4.5" fill="#334765"/>
    <rect x="148" y="464" width="390" height="26" rx="8" fill="#111E42"/>
    <circle cx="166" cy="477" r="7" fill="#0B2B3A" stroke="#38BDF8" stroke-opacity="0.6"/>
    <rect x="184" y="472" width="170" height="9" rx="4.5" fill="#475569"/>
    <rect x="470" y="472" width="52" height="9" rx="4.5" fill="#334765"/>
  </g>

  <!-- Mobile PWA (front layer) -->
  <g>
    <rect x="580" y="88" width="184" height="384" rx="28" fill="#101B3D" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="2"/>
