<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Vista previa de app web progresiva con dashboard en tiempo real">
  <defs>
    <linearGradient id="pwaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#070B19"/>
    </linearGradient>
    <linearGradient id="pwaAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="pwaArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pwaGlow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="560" rx="20" fill="url(#pwaBg)"/>
  <rect width="800" height="560" rx="20" fill="url(#pwaGlow)"/>

  <!-- Desktop dashboard (back layer) -->
  <g>
    <rect x="36" y="56" width="520" height="448" rx="18" fill="#0E1935" stroke="#1C2541"/>
    <!-- Sidebar -->
    <rect x="36" y="56" width="88" height="448" rx="18" fill="#101B3D"/>
    <rect x="58" y="88" width="44" height="44" rx="12" fill="url(#pwaAccent)" opacity="0.9"/>
    <rect x="64" y="160" width="32" height="32" rx="9" fill="#1C2541"/>
    <rect x="64" y="208" width="32" height="32" rx="9" fill="#0B2B3A" stroke="#00F0FF" stroke-opacity="0.6"/>
    <rect x="64" y="256" width="32" height="32" rx="9" fill="#1C2541"/>
    <rect x="64" y="304" width="32" height="32" rx="9" fill="#1C2541"/>

    <!-- Topbar -->
    <rect x="148" y="80" width="180" height="14" rx="7" fill="#E2E8F0"/>
    <rect x="148" y="104" width="110" height="9" rx="4.5" fill="#475569"/>
    <circle cx="516" cy="94" r="16" fill="#161A45" stroke="#8B5CF6" stroke-opacity="0.6"/>

    <!-- Stat tiles -->
    <g>
      <rect x="148" y="136" width="122" height="76" rx="12" fill="#111E42" stroke="#1C2541"/>
      <rect x="162" y="150" width="42" height="8" rx="4" fill="#64748B"/>
      <text x="162" y="188" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#00F0FF">12.4K</text>
      <rect x="162" y="196" width="60" height="6" rx="3" fill="#334765"/>
    </g>
    <g>
      <rect x="282" y="136" width="122" height="76" rx="12" fill="#111E42" stroke="#1C2541"/>
      <rect x="296" y="150" width="42" height="8" rx="4" fill="#64748B"/>
      <text x="296" y="188" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#8B5CF6">98.9%</text>
      <rect x="296" y="196" width="60" height="6" rx="3" fill="#334765"/>
    </g>
    <g>
      <rect x="416" y="136" width="122" height="76" rx="12" fill="#111E42" stroke="#1C2541"/>
      <rect x="430" y="150" width="42" height="8" rx="4" fill="#64748B"/>
      <text x="430" y="188" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#38BDF8">0.8s</text>
      <rect x="430" y="196" width="60" height="6" rx="3" fill="#334765"/>
    </g>

    <!-- Area chart -->
    <rect x="148" y="228" width="390" height="152" rx="12" fill="#111E42" stroke="#1C2541"/>
    <rect x="164" y="244" width="90" height="9" rx="4.5" fill="#64748B"/>
    <path d="M164 352 L204 340 L244 346 L284 322 L324 330 L364 302 L404 310 L444 284 L484 290 L522 268"
