    <!-- App header -->
    <rect x="598" y="126" width="148" height="34" rx="10" fill="#161A45"/>
    <circle cx="616" cy="143" r="9" fill="url(#pwaAccent)"/>
    <rect x="634" y="138" width="72" height="10" rx="5" fill="#CBD5E1"/>

    <!-- Notification card -->
    <rect x="598" y="172" width="148" height="52" rx="12" fill="#111E42" stroke="#00F0FF" stroke-opacity="0.4"/>
    <circle cx="618" cy="198" r="10" fill="#0B2B3A" stroke="#00F0FF" stroke-opacity="0.7"/>
    <path d="M613 198 l4 4 7 -8" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="636" y="186" width="86" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="636" y="203" width="60" height="8" rx="4" fill="#475569"/>

    <!-- Donut chart -->
    <g transform="translate(672, 292)">
      <circle r="46" fill="none" stroke="#1C2541" stroke-width="12"/>
      <circle r="46" fill="none" stroke="url(#pwaAccent)" stroke-width="12"
              stroke-dasharray="216 289" stroke-linecap="round" transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">75%</text>
      <text y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748B">engagement</text>
    </g>

    <!-- Quick actions -->
    <rect x="598" y="360" width="70" height="46" rx="12" fill="#161A45" stroke="#1C2541"/>
    <rect x="676" y="360" width="70" height="46" rx="12" fill="#161A45" stroke="#1C2541"/>
    <rect x="612" y="376" width="42" height="8" rx="4" fill="#8B5CF6"/>
    <rect x="690" y="376" width="42" height="8" rx="4" fill="#00F0FF"/>

    <!-- Bottom nav -->
    <rect x="598" y="420" width="148" height="38" rx="14" fill="#161A45"/>
    <circle cx="626" cy="439" r="6" fill="#00F0FF"/>
    <circle cx="672" cy="439" r="6" fill="#334765"/>
    <circle cx="718" cy="439" r="6" fill="#334765"/>
  </g>

  <!-- Offline-ready badge -->
  <g>
    <rect x="560" y="500" width="204" height="34" rx="17" fill="#0B132B" stroke="#00F0FF" stroke-opacity="0.5"/>
    <circle cx="582" cy="517" r="5" fill="#10B981"/>
    <text x="596" y="522" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#CBD5E1">PWA · Offline Ready · Push</text>
  </g>
</svg>
